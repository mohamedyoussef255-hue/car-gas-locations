    <meta property="og:title" content="محطات الغاز الطبيعي - مُعين الذكي | كارجاس وشركات الغاز" />

    <script>
      // 1. Permanently ban and disable browser robotic speech synthesis (SpeechSynthesis)
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak = function() {
            console.warn('[AUDIO] Browser robotic speech synthesis has been completely blocked.');
          };
        }
      } catch (e) {}

      // 2. Suppress harmless Vite HMR WebSocket connection errors in iframe as specified in environment guidelines
      window.addEventListener('error', function(event) {
        if (
          (event.filename && event.filename.includes('@vite/client')) ||
          (event.message && (event.message.includes('WebSocket') || event.message.includes('createWebSocketModuleRunnerTransport')))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || String(event.reason).includes('@vite/client'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
